{% assign person = site.data.person %}
<header class="site-header">
  <div class="site-container site-header__inner{% if page.url == "/" %} site-header__inner--home{% endif %}">
    {% unless page.url == "/" %}<a class="site-name" href="/">{{ person.schema.display_name }}</a>{% endunless %}
    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
