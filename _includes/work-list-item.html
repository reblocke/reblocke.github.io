{% assign item = include.item %}
<article class="work-item" data-work-id="{{ item.id | escape }}">
  <p class="item-meta">{{ item.year }} · {% include work-item-meta.html item=item %}</p>
  <h3>{{ item.title }}</h3>
  {% if item.summary %}<p class="prose">{{ item.summary }}</p>{% endif %}
  <p class="item-links">
    {% include work-item-links.html item=item %}
  </p>
</article>
