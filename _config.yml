locale: "en-US"
title: "Brian W. Locke, MD, MSCI"
url: "https://reblocke.github.io"
baseurl: ""
repository: "reblocke/reblocke.github.io"
google_site_verification: "-TfOF1pQZXttNMV7CdweSLy-mQaKA7bwkM4CM02BQEw"
timezone: "America/Denver"
future: false
encoding: "utf-8"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap

include:
  - _pages
  - _generated_routes
  - files

exclude:
  - AGENTS.md
  - bin
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - vendor
  - node_modules
  - maintenance
  - config

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: "files/**/*.htm*"
    values:
      sitemap: false

sass:
  sass_dir: _sass
  style: compressed
