summary: >-
  My research uses linked clinical and claims data, computable phenotypes,
  clinical prediction, causal inference, and pragmatic trials to improve the
  recognition and management of respiratory failure. I practice in the Shock
  Trauma ICU and Schmidt Chest Clinic and serve as core faculty in the
  University of Utah Pulmonary and Critical Care Fellowship.
research_statement: >-
  I study how health systems recognize, evaluate, and manage respiratory
  failure, from physiologic measurement through care after hospitalization.
