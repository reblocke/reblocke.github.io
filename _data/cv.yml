research_support:
  current:
    - id: "support-r01hl169521"
      title: "Informing best practices for evaluation and treatment of myocardial injury during sepsis"
      sponsor: "NIH NHLBI"
      award: "R01HL169521"
      role: "Intermountain site contributor"
      dates: "11/2025–06/2027"
      summary: >-
        Evaluates diagnostic and treatment practices for myocardial injury
        during sepsis using harmonized electronic health record data.
    - id: "support-fund-hypercapnia"
      title: "Follow-up Utilization and Needs after Discharge with Hypercapnic Respiratory Failure (FUND-Hypercapnia)"
      sponsor: "Intermountain Clinical and Research Fund"
      role: "PI"
      dates: "09/2024–02/2027"
      summary: >-
        Uses administrative data to characterize post-discharge testing,
        specialty referral patterns, healthcare utilization, and costs after
        hospitalization with hypercapnic respiratory failure.
  completed:
    - id: "support-ats-aspire"
      title: "Developing a Computable Phenotype for Hypercapnic Respiratory Failure"
      sponsor: "American Thoracic Society"
      award: "ASPIRE Fellowship"
      role: "PI"
      dates: "07/2022–06/2024"
      summary: >-
        Supported development of reproducible electronic health record
        approaches to defining hypercapnic respiratory failure.
    - id: "support-t32hl105321"
      title: "Multidisciplinary Pulmonary and Critical Care Research Training Program"
      sponsor: "NIH NHLBI"
      award: "T32HL105321"
      role: "Postdoctoral trainee"
      dates: "06/2022–05/2024"
      summary: >-
        Supported formal research training in pulmonary and critical care
        clinical investigation.

